[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
serde = { version = "1.0.229",features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links"] }
egui = "0.37.0"
chrono = {version = "0.4.45",features = ["serde"]}
powershell_script = "1.1.0"
walkdir = "2.5.0"
rodio = "0.23.0"
rsautogui = "0.3.0"
windows-sys = { version = "0.61.2",features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winres = "0.1.12"